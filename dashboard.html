
<!DOCTYPE html>
<html lang="en">
<header class="dashboard-header">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROOFNEAR | Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    
.dashboard-layout {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 85vh;
  padding: 0 16px 24px;
}

.dashboard-sidebar {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 24px 20px;
  border-radius: 22px;
  background: linear-gradient(145deg, #075e54, #06483f);
  color: #ffffff;
  border: 0;
  box-shadow: 0 12px 30px rgba(0, 50, 42, 0.18);
}

.admin-heading {
  color: #ffffff;
  font-size: 21px;
  line-height: 1.25;
  margin: 0;
  font-weight: 800;
}

.sidebar-toggle {
  display: block;
  width: 54px;
  height: 48px;
  margin: 18px auto;
  border: 0;
  border-radius: 9px;
  background: #ffffff;
  color: #08745f;
  font-size: 27px;
  cursor: pointer;
}

.sidebar-brand h2 {
  color: #ffffff;
  font-size: 25px;
  font-weight: 800;
  margin: 12px 0;
}

.sidebar-divider {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.35);
  margin-bottom: 18px;
}

.sidebar-menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 14px;
}

.dashboard-sidebar .sidebar-link {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 46px;
  margin: 0;
  padding: 9px 6px;
  color: #ffffff;
  background: transparent;
  border: 0;
  border-radius: 8px;
  text-align: left;
  font-size: 13px;
  cursor: pointer;
}

.dashboard-sidebar .sidebar-link:hover {
  background: rgba(255,255,255,0.13);
}

.sidebar-icon {
  font-size: 17px;
  flex-shrink: 0;
}

.sidebar-label {
  line-height: 1.25;
}

.notification-badge {
  background: #e53935;
  color: #ffffff;
  border-radius: 50%;
  min-width: 19px;
  height: 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.dashboard-main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 14px;
  background: var(--card, #fff);
  border: 1px solid #ddd;
  min-width: 0;
}

.dashboard-card {
  padding: 18px;
  margin: 12px 0;
  border: 1px solid #ddd;
  border-radius: 12px;
}

@media(max-width:700px) {
  .dashboard-layout {
    padding: 0 12px 20px;
  }

  .dashboard-sidebar {
    padding: 22px 16px;
  }

  .dashboard-main {
    padding: 16px;
  }
}

.dashboard-header {
  display: block !important;
  width: 100%;
  margin: 0 !important;
  padding: 0 !important;
  background: #ffffff !important;
  border: 0 !important;
  box-shadow: none !important;
}

.dashboard-header-empty {
  height: 85px;
  width: 100%;
  background: #ffffff;
}

.dashboard-header-gold-line {
  width: 100%;
  height: 3px;
  background: #d6a84b;
}

.dashboard-header p {
  margin: 0 !important;
  padding: 9px 16px 14px !important;
  color: #71817d !important;
  font-size: 12px !important;
  line-height: 1.2;
  white-space: nowrap;
}

  </style>
</head>
<body>


<header class="dashboard-header">
  <div class="dashboard-header-empty"></div>
  <div class="dashboard-header-gold-line"></div>
  <p>Your opportunities. Your progress.</p>
</header>

<div class="dashboard-layout">

  


<aside class="dashboard-sidebar" id="dashboardSidebar">

  <div class="sidebar-top">
    <h3 class="admin-heading">🔐 Admin<br>Panel</h3>

    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Expand or collapse menu">
      ☰
    </button>
  </div>

  <div class="sidebar-brand">
    <h2>PROOFNEAR</h2>
    <div class="sidebar-divider"></div>
  </div>

  <div class="sidebar-menu-grid">

    <button class="sidebar-link" onclick="showSection('overview')" title="Overview">
      <span class="sidebar-icon">🏠</span>
      <span class="sidebar-label">Overview</span>
    </button>

    <button class="sidebar-link" onclick="showSection('opportunities')" title="My Opportunities">
      <span class="sidebar-icon">💼</span>
      <span class="sidebar-label">My Opportunities</span>
    </button>

    <button class="sidebar-link" onclick="showSection('post')" title="Post Opportunity">
      <span class="sidebar-icon">➕</span>
      <span class="sidebar-label">Post Opportunity</span>
    </button>

    <button class="sidebar-link" onclick="showSection('notifications')" title="Notifications">
      <span class="sidebar-icon">🔔</span>
      <span class="sidebar-label">Notifications</span>
      <span id="notificationBadge" class="notification-badge" style="display:none;">0</span>
    </button>

    <button class="sidebar-link" onclick="logoutUser()" title="Log Out">
      <span class="sidebar-icon">🚪</span>
      <span class="sidebar-label">Log Out</span>
    </button>

    <button class="sidebar-link" onclick="showSection('profile')" title="My Profile">
      <span class="sidebar-icon">👤</span>
      <span class="sidebar-label">My Profile</span>
    </button>

    <button class="sidebar-link" onclick="showSection('payments')" title="My Payments">
      <span class="sidebar-icon">💰</span>
      <span class="sidebar-label">My Payments</span>
    </button>

    <button class="sidebar-link" onclick="showSection('messages')" title="Messages">
      <span class="sidebar-icon">✉️</span>
      <span class="sidebar-label">Messages</span>
    </button>

    <button class="sidebar-link" onclick="showSection('settings')" title="Settings">
      <span class="sidebar-icon">⚙️</span>
      <span class="sidebar-label">Settings</span>
    </button>

    <button class="sidebar-link" onclick="location.href='index.html'" title="Homepage">
      <span class="sidebar-icon">←</span>
      <span class="sidebar-label">Homepage</span>
    </button>

  </div>
</aside>


  <main class="dashboard-main" id="dashboardContent">
    <h2>Welcome to PROOFNEAR</h2>
    <p>Your dashboard is loading...</p>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dashboard.js"></script>
</body>
</html>
